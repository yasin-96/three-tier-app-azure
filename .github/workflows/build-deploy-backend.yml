name: Backend Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        run: mvn -f backend/pom.xml clean package -DskipTests

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name acrthreetier

      - name: Build and Push Image
        working-directory: backend
        run: |
          docker build -t acrthreetier.azurecr.io/backend:${{ github.sha }} .
          docker push acrthreetier.azurecr.io/backend:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name backend-app \
            --resource-group three-tier-rg \
            --image acrthreetier.azurecr.io/backend:${{ github.sha }}